version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: 'development'
      production-dependencies:
        dependency-type: 'production'
    # Major-version bumps of build/test/lint tooling commonly require codemods,
    # config rewrites, or Node-version bumps — too risky for an automated PR.
    # Track them manually and apply via dedicated single-tool PRs.
    #
    # Coverage expanded after PR #60 (dev-deps weekly bundle) failed build + e2e
    # by including tailwindcss 3→4 (full config API rewrite), eslint-plugin-unicorn
    # 55→64, eslint-plugin-security 3→4, eslint-config-prettier 9→10, lint-staged
    # 15→17 in a single grouped commit with no isolated revert path. Wildcard
    # patterns added so future tooling-major bumps land in their own PRs.
    ignore:
      # TypeScript core
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

      # ESLint ecosystem — every plugin major reshuffles rule names
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-import-resolver-*'
        update-types: ['version-update:semver-major']

      # Test runners
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

      # Commit / lint tooling — config shape changes between majors
      - dependency-name: '@commitlint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lint-staged'
        update-types: ['version-update:semver-major']
      - dependency-name: 'husky'
        update-types: ['version-update:semver-major']

      # CSS framework — tailwind 3→4 is a full config-API migration
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']

      # Framework majors — each is a Phase-level decision, never auto-bumped
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'drizzle-orm'
        update-types: ['version-update:semver-major']
      - dependency-name: 'drizzle-kit'
        update-types: ['version-update:semver-major']

      # Runtime libraries — each major is its own migration story (added
      # after PR #45 / #65 reopened the same 5 runtime majors grouped
      # together with no isolated revert path).
      # • zod 3→4    — ZodIssue shape changed ({origin,...}); every test
      #                asserting on the issue payload would need updating.
      # • pg-boss 10→12 — worker queue behavior, transactional retry
      #                semantics change between majors (Doc 03 §9).
      # • @sentry/node 8→10 — SDK v10 reworks transport + integrations API.
      # • @fastify/helmet 12→13 — CSP directive shape can change between
      #                majors; we treat header config as a security gate
      #                and want manual review on any bump.
      # • pino-http 10→11 — request/response serializer API surface changes.
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pg-boss'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sentry/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@fastify/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pino-http'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pino'
        update-types: ['version-update:semver-major']

      # FE runtime libraries — added after PR #69 (closed) bundled three
      # major bumps that would have collided with V11 Design Re-skin
      # (Track A: tokens.css → tailwind.config.ts + reskin every page).
      # • lucide-react 0→1   — icon API shape change; shell.jsx +
      #                        every component using icons would break.
      # • next-intl 3→4      — config + t.rich callback signature changed
      #                        (already bit us in PR #57 → #61). Another
      #                        major mid-V11 = re-fix scattered across A.S1..S15.
      # • tailwind-merge 2→3 — affects cn() helper used in every component.
      # • @t3-oss/env-core pre-1.0 — minor bump IS breaking (pre-1.0 semver).
      # Re-evaluate after v11.0-mvp-complete tag.
      - dependency-name: 'lucide-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next-intl'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwind-merge'
        update-types: ['version-update:semver-major']
      - dependency-name: '@t3-oss/env-core'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
